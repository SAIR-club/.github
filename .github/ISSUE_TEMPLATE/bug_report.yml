name: Bug Report / 缺陷报告
description: 提交程序中的异常、报错或非预期行为
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: 感谢提交缺陷报告！请尽可能提供可复现的最小示例。
  - type: textarea
    id: problem
    attributes:
      label: 问题现象
      description: 发生了什么异常情况？
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 如何触发该问题？
      placeholder: |
        1. 运行命令 ...
        2. 传入参数 ...
        3. 观察到报错 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      description: 正常情况下应该发生什么？
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: Node 版本、OS、包管理器等
      value: |
        - OS: Windows / macOS / Linux
        - Node: 
        - pnpm: 
