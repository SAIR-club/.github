# SAIR-club System-Level Labels
# Global organization-wide standard labels synced to all repositories.
# Repository-specific module/architecture scopes (e.g. core, web, blocks) belong to their respective repositories.

# ── Conventional Commits Types ───────────────────────────────────────────────
- name: feat
  color: "a2eeef"
  description: "新功能 (New feature)"
- name: fix
  color: "d73a4a"
  description: "缺陷修复 (Bug fix)"
- name: refactor
  color: "fbca04"
  description: "代码重构 (Code refactoring)"
- name: perf
  color: "fbca04"
  description: "性能优化 (Performance improvement)"
- name: docs
  color: "0075ca"
  description: "文档变更 (Documentation)"
- name: test
  color: "bfdadc"
  description: "测试用例 (Testing additions and fixes)"
- name: build
  color: "f9d0c4"
  description: "构建配置与依赖 (Build and dependency changes)"
- name: ci
  color: "f9d0c4"
  description: "CI/CD 自动化 (Continuous integration workflows)"
- name: chore
  color: "f9d0c4"
  description: "日常维护与小调整 (Routine maintenance)"
- name: revert
  color: "d73a4a"
  description: "回滚提交 (Revert a previous change)"
- name: style
  color: "bfdadc"
  description: "代码格式与风格 (Code formatting)"

# ── Priorities ───────────────────────────────────────────────────────────────
- name: p0
  color: "b60205"
  description: "紧急阻断性任务 (Critical blocker)"
- name: p1
  color: "d93f0b"
  description: "高优先级任务 (High priority)"
- name: p2
  color: "fbca04"
  description: "常规优先级任务 (Medium priority)"
- name: p3
  color: "0e8a16"
  description: "低优先级任务 (Low priority / backlog)"

# ── Status & Workflow ────────────────────────────────────────────────────────
- name: status:in-review
  color: "fef2c0"
  description: "等待审阅中 (Under review)"
- name: status:ready-to-merge
  color: "0e8a16"
  description: "审阅通过准备合入 (Ready to merge)"
- name: status:blocked
  color: "b60205"
  description: "被前置依赖阻塞 (Blocked by dependency)"
- name: stale
  color: "6a737d"
  description: "长期无活动 (No activity for 60+ days)"
- name: dependencies
  color: "0366d6"
  description: "依赖项自动更新 (Dependency updates)"

# ── Resolution & Triage Defaults ─────────────────────────────────────────────
- name: duplicate
  color: "cfd3d7"
  description: "重复的 Issue 或 PR"
- name: good first issue
  color: "7057ff"
  description: "适合新成员上手"
- name: help wanted
  color: "008672"
  description: "需要外部协助"
- name: question
  color: "d876e3"
  description: "疑问或方案咨询"
- name: invalid
  color: "e4e669"
  description: "无效的 Issue 或 PR"
- name: wontfix
  color: "ffffff"
  description: "暂不处理或已废止"
