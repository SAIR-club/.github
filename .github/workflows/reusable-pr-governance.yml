name: Reusable PR Governance

on:
  workflow_call:
    inputs:
      types:
        description: 'Allowed Conventional Commit types'
        type: string
        default: |
          feat
          fix
          refactor
          perf
          docs
          test
          build
          ci
          chore
          revert
          style

jobs:
  validate-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Validate Conventional Commit Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: ${{ inputs.types }}

  auto-label:
    name: Auto Label PR
    needs: validate-title
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Parse Title and Apply Labels
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const title = pr.title;

            const match = title.match(/^([a-z]+)(?:\(([a-z0-9_/, -]+)\))?!?:/i);
            if (!match) return;

            const type = match[1].toLowerCase();
            const rawScope = match[2] ? match[2].toLowerCase() : '';

            const COMMIT_TYPES = new Set([
              'feat', 'fix', 'refactor', 'perf', 'docs', 'test', 'build', 'ci', 'chore', 'revert', 'style'
            ]);

            const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const availableLabels = new Set(repoLabels.map(l => l.name));
            const currentLabels = new Set((pr.labels || []).map(l => l.name));

            const labelsToAdd = [];

            if (COMMIT_TYPES.has(type) && availableLabels.has(type) && !currentLabels.has(type)) {
              labelsToAdd.push(type);
            }

            const scopes = rawScope.split(/[,/ ]+/).map(s => s.trim());
            for (const s of scopes) {
              if (s && availableLabels.has(s) && !currentLabels.has(s)) {
                labelsToAdd.push(s);
              }
            }

            const labelsToRemove = [];
            for (const l of currentLabels) {
              if (COMMIT_TYPES.has(l) && COMMIT_TYPES.has(type) && l !== type) {
                labelsToRemove.push(l);
              }
            }

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: labelsToAdd,
              });
              console.log(`PR #${pr.number}: added labels:`, labelsToAdd);
            }

            for (const label of labelsToRemove) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label,
                });
                console.log(`PR #${pr.number}: removed stale label:`, label);
              } catch (e) {
                console.warn(`Could not remove label ${label}:`, e.message);
              }
            }
