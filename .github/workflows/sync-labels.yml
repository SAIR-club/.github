name: Sync Labels Across Organization

on:
  push:
    branches:
      - main
    paths:
      - '.github/labels.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  sync-labels:
    name: Sync Labels to All Repositories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync Labels via srealmoreno/label-sync-action
        uses: srealmoreno/label-sync-action@v2
        with:
          token: ${{ secrets.ORG_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
          account-type: org
          owner: SAIR-club
          auto-discover-repos: true
          config-file: .github/labels.yml
